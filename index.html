<style>
:root{color-scheme:dark;--bg:#08090a;--panel:#1b1d21;--panel2:#24272c;--line:#30333a;--line2:#454953;--tx:#ececee;--mut:#8d919a;--ok:#86d4a0;--amb:#e0b565;--f:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}

body::before{content:"";position:fixed;inset:-12px;z-index:-1;background:linear-gradient(#08090a80,#08090ab3),var(--bgimg) center/cover no-repeat #08090a;filter:blur(4px);pointer-events:none}

button:focus-visible,input:focus-visible,a:focus-visible{outline:2px solid #cfd3dc;outline-offset:2px}
.top{position:sticky;top:0;z-index:10;background:#08090ae6;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
.top-in{max-width:1000px;margin:0 auto;padding:0 20px;height:60px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:16px}
.logo{font-weight:700;font-size:17px;letter-spacing:-.01em;white-space:nowrap}

main{max-width:1000px;margin:0 auto;padding:32px 20px 24px}
h1{margin:0 0 4px;font-size:24px;font-weight:700;letter-spacing:-.02em}
.sub{margin:0 0 22px;color:var(--mut);max-width:62ch}
.tools{display:flex;gap:10px;margin-bottom:18px;flex-wrap:wrap}
input[type=search]{flex:1;min-width:200px;background:var(--panel);border:1px solid var(--line);color:var(--tx);padding:10px 14px;border-radius:8px;font:inherit;transition:border-color .15s,box-shadow .15s}

.sw{display:inline-flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:9px 14px;cursor:pointer;color:var(--mut);user-select:none;transition:border-color .15s}
.sw:hover{border-color:var(--line2)}
.sw input{display:none}
.sw .knob{width:32px;height:18px;border-radius:99px;background:var(--panel2);border:1px solid var(--line2);position:relative;transition:.2s}
.sw .knob::after{content:"";position:absolute;top:2px;left:2px;width:12px;height:12px;border-radius:50%;background:var(--mut);transition:.2s}
.sw:has(input:checked){color:var(--tx)}
.sw input:checked+.knob{background:var(--tx);border-color:var(--tx)}
.sw input:checked+.knob::after{left:16px;background:var(--bg)}
.lvl{--dc:var(--line2);background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--dc);border-radius:10px;margin-bottom:10px;overflow:hidden;transition:border-color .15s,background .15s}
.lvl:hover,.lvl.open{border-color:var(--line2);border-left-color:var(--dc);background:#202328}

.thumb{position:relative;width:240px;flex:none;aspect-ratio:16/9;border-radius:6px;overflow:hidden;background:#2a2d33;display:grid;place-items:center}
.thumb img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}

.rec{font-size:13px}

.tbl th,.tbl td{padding:12px 16px;font-size:14px}
.rec tr:last-child td,.tbl tr:last-child td{border-bottom:0}
.rec th,.tbl th{color:var(--mut);font-size:12px;font-weight:500;background:#22252a}
.rec td:first-child,.rec th:first-child{width:34px;color:var(--mut)}
.rec .r{text-align:right;font-variant-numeric:tabular-nums}
.rec .vf{color:var(--ok);font-size:12px}

.rec td.part .pc{color:var(--amb)}
.rec .bar{display:block;height:4px;min-width:70px;border-radius:99px;background:#33363d;margin-top:5px;overflow:hidden}
.rec .bar i{display:block;height:100%;border-radius:99px;background:var(--ok)}
.rec td.part .bar i{background:var(--amb)}
.tbl tr.row{cursor:pointer;transition:background .15s}.tbl tr.row:hover{background:var(--panel2)}
.wrap{overflow-x:auto}
.podium{display:flex;align-items:flex-end;justify-content:center;gap:12px;margin:8px 0 24px}
.pod{flex:1;max-width:220px;display:flex;flex-direction:column;align-items:center;text-align:center;cursor:pointer;transition:transform .2s}
.pod:hover{transform:translateY(-3px)}
.pod.p1{--c:#d9b45a;--c2:#8a6a24}.pod.p2{--c:#b8bcc6;--c2:#6c717d}.pod.p3{--c:#b27b50;--c2:#6e4528}

.top1{color:#d9b45a}.top2{color:#b8bcc6}.top3{color:#b27b50}

.box{background:var(--panel);border:1px solid var(--line2);border-radius:14px;max-width:620px;width:100%;max-height:90vh;overflow:auto;box-shadow:0 24px 60px #000a}

/* ===== ДАННЫЕ — редактируй только тут =====
 Одна строка = один уровень. Порядок строк = место в списке (первая строка — топ 1).
 Формат:  Название | ID уровня | Сложность (можно пустой; через ; редкость из папки faces: Easy Demon; Epic — без редкости берётся none) | Время (можно пустым) | Создатель | Верифер | ссылка или ID ютуб видео | yes/no (верифицирован?) | рекорды (через запятую; можно с процентом: ник 72%, без процента = 100%; меньше 100% даёт 0.3× очков уровня)
 Строки, начинающиеся с #, игнорируются. */
const DEMONS=`
Renaissance | - | Extreme Demon; Legendary | - | yusttyy | yusttyy | XXXXXXXXXXX | no |
Fusion Circles | - | Hard Demon; Feature | - | s1lent | s1lent | XXXXXXXXXXX | no |
I dont like this | 9 | Medium Demon | 0:49 | s1lent | s1lent | 0LkCaXiTRJk | yes | yusttyy 100%
Goodbye | 8 | Easy Demon | 0:30 | yusttyy | yusttyy | MN-1RR10JX8 | yes | bibis 100%
`;
const CHALLENGES=`
Nebula | - | Insane | 0:12 | yusttyy | yusttyy | aMbZmgbm9zk | no | yusttyy 47%
SINERACK | 4 | Insane | 0:04 | yusttyy | yusttyy | oXLW1KTzgbs | yes | 
Loop | - | Harder | 0:09 | s1lent | s1lent | z6hIrivJ2ow | yes | yusttyy 100%
DINAMIKA | 2 | Hard | 0:06 | bibis | bibis | sl1KzlnIRWA | yes | yusttyy 100%, s1lent 100%, randomdude 50%
`;
/* ===== ОЧКИ (одинаково для демон и челлендж листа) =====
 FIRST — очки за 1 место, DROP — во сколько раз меньше каждое следующее место
 (0.8 → 100, 80, 64, 51.2 …), VERIFY_BONUS — множитель для верифера уровня,
 PARTIAL — множитель за рекорд меньше 100% (0.3 → за 50% на топ-1 уровне дают 30 очков; процент не важен, важно что не 100%). */
const FIRST=100, DROP=0.8, VERIFY_BONUS=1.1, PARTIAL=0.3;
const pts=r=>+(FIRST*Math.pow(DROP,r-1)).toFixed(2);
/* ===== логика ===== */
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const ytId=v=>{const m=String(v||"").match(/(?:v=|youtu\.be\/|embed\/)?([\w-]{11})/);return m?m[1]:""};
const ytUrl=v=>"https://www.youtube.com/watch?v="+ytId(v);
let tab="demon", showUnv=false;
const META={demon:["Демон лист","Топ сложнейших уровней YurtLink GDPS. Чем выше уровень, тем больше очков."],
challenge:["Челлендж лист","Уровни-челленджи сервера: короткие, но очень требовательные."],
players:["Лист игроков","Рейтинг по сумме очков за верификации и рекорды."]};
const THQ=["maxresdefault","sddefault","hqdefault"];
function blSync(im){const b=im.parentNode.querySelector(".bl");if(b&&b.src!==im.src)b.src=im.src}
function thumbFb(im){const n=+im.dataset.n+1;if(n<THQ.length){im.dataset.n=n;im.src="https://img.youtube.com/vi/"+im.dataset.v+"/"+THQ[n]+".jpg"}else im.remove()}
/* ===== ЦВЕТА СЛОЖНОСТЕЙ =====
 Если в названии есть слово "demon" — берётся палитра демонов; иначе палитра зависит от листа
 (демон лист → демоны, челлендж лист → обычные). Порядок важен: harder проверяется раньше hard. */
const DIFF_REG=[["insane","#ff4de4"],["harder","#ff4500"],["hard","#ffcc00"],["normal","#01ef00"],["easy","#00aeff"]];
const DIFF_DEM=[["extreme","#b80000"],["insane","#f31f12"],["hard","#ff3950"],["medium","#d838cd"],["easy","#9447f9"]];
const dc=d=>{d=(d||"").toLowerCase();const dem=d.includes("demon")||tab==="demon";const f=(dem?DIFF_DEM:DIFF_REG).find(x=>d.includes(x[0]));return f?f[1]:"var(--tx)"};
/* Иконка сложности: faces/<редкость>/<сложность>.png, где имя файла — сложность в camelCase
 (Easy Demon → easyDemon.png). Нет файла — иконка просто не показывается. */
const faceFile=d=>{const w=(d||"").toLowerCase().split(/[^a-z0-9]+/).filter(Boolean);return w.map((x,i)=>i?x[0].toUpperCase()+x.slice(1):x).join("")};
const faceImg=l=>{const f=faceFile(l.diff);return f?`<img class="face" alt="" src="faces/${l.rarity}/${f}.png" onerror="this.remove()">`:""};
function thumb(l,rank){
 const i=ytId(l.yt);
 return `<div class="thumb"><span class="pl">▶</span>${i?`<img loading="lazy" alt="" data-v="${i}" data-n="0" src="https://img.youtube.com/vi/${i}/maxresdefault.jpg" onload="if(this.naturalWidth<200)thumbFb(this);else blSync(this)" onerror="thumbFb(this)"><img class="bl" alt="" aria-hidden="true">`:""}${rank?`<span class="rank">#${rank}</span>`:""}</div>`;
}
/* ===== ДЛИНА УРОВНЯ =====
 Время пишется как 0:45, 1:30 (м:сс) или просто секундами (45). Категория считается сама:
 меньше 10 с — Tiny, до 30 — Short, до 60 — Medium, до 120 — Long, дальше — XL.
 Вместо времени можно написать сразу категорию: Tiny / Short / Medium / Long / XL. */
const LEN_STEPS=[["Tiny",10],["Short",30],["Medium",60],["Long",120]];
const LEN_NAMES=["Tiny","Short","Medium","Long","XL"];
const parseLen=t=>{
 t=(t||"").trim(); if(!t)return null;
 const k=LEN_NAMES.findIndex(n=>n.toLowerCase()===t.toLowerCase());
 if(k>=0)return {cat:LEN_NAMES[k],text:""};
 let sec=NaN;
 if(/^\d+:\d{1,2}(:\d{1,2})?$/.test(t))sec=t.split(":").reduce((a,x)=>a*60+ +x,0);
 else if(/^\d+(\.\d+)?s?$/i.test(t))sec=parseFloat(t);
 if(isNaN(sec))return {cat:"",text:t};
 sec=Math.round(sec);
 return {cat:(LEN_STEPS.find(x=>sec<x[1])||["XL"])[0],text:Math.floor(sec/60)+":"+String(sec%60).padStart(2,"0")};
};
const lenText=o=>o.text&&o.cat?`${o.text} (${o.cat})`:(o.text||o.cat||"");
/* прошли: "ник" = 100%, "ник 72%" = прогресс 72% (работает и для unverified) */
const parseVic=v=>(v||"").split(",").map(x=>x.trim()).filter(Boolean).map(x=>{
 const m=x.match(/^(.*?)[\s:]*(\d{1,3}(?:[.,]\d+)?)\s*%$/);
 return m&&m[1].trim()?{n:m[1].trim(),p:Math.min(100,parseFloat(m[2].replace(",","."))||0)}:{n:x,p:100};
});
const fullN=l=>new Set([...(l.verified?[l.verifier]:[]),...l.victors.filter(v=>v.p>=100).map(v=>v.n)]).size;
const bestP=l=>{
 /* Показываем лучший прогресс только если уровень unverified, либо среди обычных игроков (без верифера) никто не набрал 100% */
 const pool=l.verified?l.victors.filter(v=>v.n!==l.verifier):l.victors;
 if(l.verified&&pool.some(v=>v.p>=100))return 0;
 return Math.max(0,...pool.map(v=>v.p));
};
const parse=t=>t.trim().split("\n").filter(s=>s.trim()&&!s.trim().startsWith("#")).map(s=>{
 const [name,id,dr,time,creator,verifier,yt,ver,v]=s.split("|").map(x=>x.trim());
 const [diff,rar]=(dr||"").split(";").map(x=>x.trim());
 return {name,id,diff,rarity:(rar||"none").toLowerCase().replace(/[^a-z0-9_-]/g,"")||"none",len:parseLen(time),creator,verifier,yt,verified:!/^(no|n|false|0)$/i.test(ver||""),victors:parseVic(v)};
});
function build(){
 const mk=(t,f)=>{let r=0;return parse(t).map((l,k)=>l.verified?({...l,idx:k,rank:++r,pts:f(r)}):({...l,idx:k,rank:0,pts:0}))};
 return {demon:mk(DEMONS,pts),challenge:mk(CHALLENGES,pts)};
}
const L=build();
function players(){
 const m={};
 const add=(n,pts,lvl,v,t,pc=100)=>{const p=m[n]||(m[n]={n,pts:0,list:[],ver:0,dem:[],chal:[]});p.pts+=pts;p.list.push(lvl);(t==="d"?p.dem:p.chal).push({name:lvl,v,pc});if(v)p.ver++};
 [["d",L.demon],["c",L.challenge]].forEach(([t,arr])=>arr.forEach(l=>{if(!l.verified)return;
  add(l.verifier,+(l.pts*VERIFY_BONUS).toFixed(2),l.name,true,t);
  const bp=new Map();l.victors.forEach(v=>bp.set(v.n,Math.max(bp.get(v.n)||0,v.p)));
  bp.forEach((pc,n)=>{if(n===l.verifier||pc<=0)return;add(n,pc>=100?l.pts:+(l.pts*PARTIAL).toFixed(2),l.name,false,t,pc)});
 }));
 return Object.values(m).sort((a,b)=>b.pts-a.pts);
}
const PN=new Set(players().map(p=>p.n));
const nick=s=>{if(!s)return"—";const a=x=>`<button type="button" class="pl" data-p="${esc(x)}">${esc(x)}</button>`;if(PN.has(s))return a(s);return s.split(/(\s*[,&]\s*)/).map(x=>PN.has(x)?a(x):esc(x)).join("")};
function goPlayer(n){tab="players";document.querySelectorAll("nav button").forEach(x=>x.classList.toggle("on",x.dataset.t==="players"));$("#q").value="";render();window.scrollTo(0,0);openPlayer(n)}
{const lv=t=>L[t].filter(l=>l.verified).length,recs=players().reduce((a,p)=>a+p.dem.length+p.chal.length,0);
const pl=(n,f)=>{const a=n%100,b=n%10;return f[a>10&&a<20?2:b===1?0:b>1&&b<5?1:2]};
$("#sum").innerHTML=[[lv("demon"),["демон","демона","демонов"]],[lv("challenge"),["челлендж","челленджа","челленджей"]],[PN.size,["игрок","игрока","игроков"]],[recs,["рекорд","рекорда","рекордов"]]].map(([n,f])=>`<b>${n}</b> ${pl(n,f)}`).join(" · ")}
function render(){
 const q=$("#q").value.trim().toLowerCase();
 $("#ttl").textContent=META[tab][0];$("#sub").textContent=META[tab][1];
 $("#unv").parentElement.style.display=tab==="players"?"none":"";
 const o=$("#out");
 if(tab==="players"){
  const all=players().map((p,i)=>({...p,rank:i+1}));
  const P=all.filter(p=>p.n.toLowerCase().includes(q));
  if(!P.length){o.innerHTML='<div class="empty">Ничего не найдено</div>';return}
  const pod=q?[]:all.slice(0,3), rest=q?P:all.slice(3);
  const podHtml=pod.length?`<div class="podium">${[1,0,2].filter(i=>pod[i]).map(i=>{const p=pod[i];return `<div class="pod p${i+1}" data-p="${esc(p.n)}">${i?"":'<div class="cr">👑</div>'}<div class="av"><svg viewBox="0 0 250 250" aria-hidden="true"><path class="o" fill-rule="evenodd" d="M6 6H244V244H6Z M64 64V186H186V64Z" stroke="#000" stroke-width="12" stroke-linejoin="miter"/><rect x="64" y="64" width="122" height="122" fill="none" stroke="#000" stroke-width="12"/><rect class="i" x="96" y="96" width="58" height="58" rx="10" stroke="#000" stroke-width="12"/></svg></div><div class="pn">${esc(p.n)}</div><div class="pp">${p.pts.toFixed(2)} очков</div><div class="step"><span>${i+1}</span></div></div>`}).join("")}</div>`:"";
  const tbl=rest.length?`<div class="wrap"><table class="tbl"><tr><th>#</th><th>Игрок</th><th>Уровней</th><th>Верификаций</th><th>Очки</th></tr>${rest.map(p=>`<tr class="row" data-p="${esc(p.n)}"><td class="${p.rank<4?"top"+p.rank:""}"><b>${p.rank}</b></td><td><b>${esc(p.n)}</b><span class="sub">${p.list.length} ур.${p.ver?" · "+p.ver+" вер.":""}</span></td><td>${p.list.length}</td><td>${p.ver}</td><td><b>${p.pts.toFixed(2)}</b></td></tr>`).join("")}</table></div>`:"";
  o.innerHTML=podHtml+tbl;
  return;
 }
 const arr=L[tab].filter(l=>(showUnv||l.verified)&&(!q||[l.name,l.creator,l.verifier,l.id].join(" ").toLowerCase().includes(q)));
 if(!arr.length){o.innerHTML='<div class="empty">Ничего не найдено</div>';return}
 o.innerHTML=arr.map(l=>`<div class="lvl" data-i="${l.idx}" style="--dc:${dc(l.diff)}"><div class="head">${thumb(l,showUnv?l.idx+1:l.rank)}<div class="info"><h3>${esc(l.name)}<span class="by">by ${nick(l.creator)}</span></h3>${l.diff?`<div class="dfc">${faceImg(l)}<b style="color:${dc(l.diff)}">${esc(l.diff)}</b></div>`:""}
 <div class="meta">Верифер: <b>${nick(l.verifier)}</b> · ID: <b>${l.id}</b>${l.len?` · ⏱ <b>${esc(lenText(l.len))}</b>`:""}</div>
 <div class="tags">${l.verified?`<span class="tag p">${l.pts} очков</span>`:'<span class="tag u">Unverified</span>'}<span class="tag ok">${fullN(l)} прошли</span>${bestP(l)?`<span class="tag u">Прогресс: ${+bestP(l).toFixed(1)}%</span>`:""}</div></div><span class="chev">▾</span></div><div class="det"></div></div>`).join("");
}
const levelDetail=l=>{
 const i=ytId(l.yt), ok=i&&!/^x+$/i.test(i);
 const web=/^https?:/.test(location.protocol);
 const vid=ok&&web?`<iframe src="https://www.youtube.com/embed/${i}?rel=0&origin=${encodeURIComponent(location.origin)}" title="${esc(l.name)}" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>`:`<div class="novid" style="padding:16px;text-align:center">${ok?"Встроенный плеер YouTube не работает, когда сайт открыт как файл с диска (ошибка 153). Запусти сайт через хостинг или локальный сервер. Пока смотри по кнопке ниже.":"Видео ещё не добавлено"}</div>`;
 const best=new Map();l.victors.forEach(v=>best.set(v.n,Math.max(best.get(v.n)||0,v.p)));
 if(l.verified)best.delete(l.verifier);
 const ppl=[...(l.verified?[{n:l.verifier,p:100,v:1}]:[]),...[...best].map(([n,p])=>({n,p})).sort((a,b)=>b.p-a.p)];
 return `<div class="det-in"><div class="dbody"><div class="vid">${vid}</div><div class="side">
 <div class="grid"><div>Создатель<b>${nick(l.creator)}</b></div><div>Верифер<b>${nick(l.verifier)}</b></div><div>ID уровня<b>${l.id}</b></div>${l.len?`<div>Длина<b>${esc(lenText(l.len))}</b></div>`:""}<div>Очки<b>${l.verified?l.pts:"—"}</b></div>${l.diff?`<div>Сложность<b style="color:${dc(l.diff)}">${faceImg(l)}${esc(l.diff)}</b></div>`:""}</div>
 <h4 style="margin:12px 0 8px">Рекорды · ${ppl.length}</h4>
 ${ppl.length?`<div class="wrap"><table class="rec"><tr><th>#</th><th>Игрок</th><th>Прогресс</th><th class="r">Очки</th></tr>${ppl.map((x,k)=>{const full=x.p>=100,pc=+x.p.toFixed(1),pt=!l.verified?"—":x.v?+(l.pts*VERIFY_BONUS).toFixed(2):full?l.pts:x.p>0?+(l.pts*PARTIAL).toFixed(2):0;return `<tr><td>${k+1}</td><td><b>${esc(x.n)}</b>${x.v?' <span class="vf" title="Верифер">✓</span>':""}</td><td class="${full?"":"part"}"><span class="pc">${pc}%</span><span class="bar"><i style="width:${Math.min(100,pc)}%"></i></span></td><td class="r">${pt}</td></tr>`}).join("")}</table></div>`:'<div class="meta">—</div>'}
 ${ok?`<p style="margin:14px 0 0"><a class="btn g" target="_blank" rel="noopener" href="${ytUrl(l.yt)}">Открыть на YouTube</a></p>`:""}
 </div></div></div>`;
};
function toggleLvl(c){
 const was=c.classList.contains("open");
 document.querySelectorAll(".lvl.open").forEach(x=>{x.classList.remove("open");setTimeout(()=>{if(!x.classList.contains("open"))x.querySelector(".det").innerHTML=""},320)});
 if(was)return;
 c.querySelector(".det").innerHTML=levelDetail(L[tab][c.dataset.i]);
 requestAnimationFrame(()=>c.classList.add("open"));
 setTimeout(()=>c.scrollIntoView({behavior:"smooth",block:"nearest"}),340);
}
const CUBE='<svg viewBox="0 0 250 250" aria-hidden="true"><path class="o" fill-rule="evenodd" d="M6 6H244V244H6Z M64 64V186H186V64Z" stroke="#000" stroke-width="12" stroke-linejoin="miter"/><rect x="64" y="64" width="122" height="122" fill="none" stroke="#000" stroke-width="12"/><rect class="i" x="96" y="96" width="58" height="58" rx="10" stroke="#000" stroke-width="12"/></svg>';
const dcT=(d,t)=>{const s=(d||"").toLowerCase();const f=((s.includes("demon")||t==="demon")?DIFF_DEM:DIFF_REG).find(x=>s.includes(x[0]));return f?f[1]:"var(--tx)"};
function pRows(p,t){
 return (t==="demon"?p.dem:p.chal).map(x=>{
  const l=L[t].find(z=>z.name===x.name);if(!l)return null;
  const full=x.v||x.pc>=100;
  const pt=x.v?+(l.pts*VERIFY_BONUS).toFixed(2):full?l.pts:+(l.pts*PARTIAL).toFixed(2);
  return {t,l,x,full,pt};
 }).filter(Boolean).sort((a,b)=>a.l.rank-b.l.rank);
}
const pTable=(t,title,rows)=>{
 const sum=+rows.reduce((a,r)=>a+r.pt,0).toFixed(2);
 const tot=L[t].filter(l=>l.verified).length,got=rows.filter(r=>r.full).length,lp=tot?+(got/tot*100).toFixed(1):0;
 const head=`<div class="sech"><h4>${title} · ${got} из ${tot}${tot?` <span class="meta">(${lp}% листа)</span>`:""}</h4>${rows.length?`<span class="meta">${sum} очков</span>`:""}</div>`;
 if(!rows.length)return head+'<div class="meta pe">Пока нет уровней</div>';
 return head+`<div class="wrap"><table class="rec pt"><tr><th>#</th><th>Уровень</th><th>Прогресс</th><th class="r">Очки</th></tr>${rows.map(r=>{
  const pc=r.x.v?100:+r.x.pc.toFixed(1);
  return `<tr class="go" data-t="${t}" data-i="${r.l.idx}"><td>#${r.l.rank}</td><td><b>${esc(r.l.name)}</b>${r.x.v?' <span class="vf" title="Верифер">✓</span>':""}${r.l.diff?`<span class="dl" style="color:${dcT(r.l.diff,t)}">${esc(r.l.diff)}</span>`:""}</td><td class="${r.full?"":"part"}"><span class="pc">${pc}%</span><span class="bar"><i style="width:${Math.min(100,pc)}%"></i></span></td><td class="r">${r.pt}</td></tr>`;
 }).join("")}</table></div>`;
};
function openPlayer(n){
 const all=players(),p=all.find(x=>x.n===n),rk=all.indexOf(p)+1;
 const D=pRows(p,"demon"),C=pRows(p,"challenge");
 const done=[...D,...C].filter(r=>r.full).length;
 const hard=D.find(r=>r.full)||C.find(r=>r.full);
 $("#box").innerHTML=`<div class="body"><button class="x" id="cl" aria-label="Закрыть">×</button>
 <div class="ph"><div class="pav${rk<4?" p"+rk:""}">${CUBE}</div><div><h2>${esc(p.n)}</h2><div class="meta">Демонов: ${D.length} · Челленджей: ${C.length}</div></div></div>
 <div class="ps"><div>Очки<b>${p.pts.toFixed(2)}</b></div><div>Место<b>#${rk}</b></div><div>Пройдено<b>${done}</b></div><div>Верификаций<b>${p.ver}</b></div>
 <div class="wide">Сложнейший уровень<b>${hard?esc(hard.l.name)+(hard.l.diff?`<span class="dl" style="color:${dcT(hard.l.diff,hard.t)}">${esc(hard.l.diff)}</span>`:""):"—"}</b></div></div>
 ${pTable("demon","Демоны",D)}${pTable("challenge","Челленджи",C)}
 <div class="meta" style="margin-top:14px">✓ — верифер уровня. Нажми на уровень, чтобы открыть его в списке.</div></div>`;
 $("#md").classList.add("show");$("#cl").onclick=close;
}
const close=()=>$("#md").classList.remove("show");
$("#md").onclick=e=>{if(e.target.id==="md")close()};
$("#box").onclick=e=>{const r=e.target.closest("tr.go");if(!r)return;
 close();tab=r.dataset.t;
 document.querySelectorAll("nav button").forEach(x=>x.classList.toggle("on",x.dataset.t===tab));
 $("#q").value="";render();
 const c=document.querySelector(`.lvl[data-i="${r.dataset.i}"]`);if(c)toggleLvl(c);
};
document.addEventListener("keydown",e=>{if(e.key==="Escape")close()});
$("#nav").onclick=e=>{const b=e.target.closest("button");if(!b)return;tab=b.dataset.t;
 document.querySelectorAll("nav button").forEach(x=>x.classList.toggle("on",x===b));$("#q").value="";render()};
$("#q").oninput=render;
$("#unv").onchange=e=>{showUnv=e.target.checked;render()};
$("#out").onclick=e=>{
 const pl=e.target.closest(".pl");if(pl){goPlayer(pl.dataset.p);return}
 const h=e.target.closest(".head");if(h){toggleLvl(h.parentElement);return}
 const r=e.target.closest(".row,.pod");if(r)openPlayer(r.dataset.p);
};
render();
</script>
<script>
(()=>{
 const B=window.BG,btn=document.getElementById("bgbtn"),pop=document.getElementById("bgpop");
 pop.innerHTML=B.list.map((f,k)=>`<button type="button" class="bgopt" data-k="${k}" aria-pressed="${k===B.i}"><img src="${f}" alt="" loading="lazy">${B.names&&B.names[k]||"Фон "+(k+1)}</button>`).join("");
 const set=k=>{B.i=k;document.documentElement.style.setProperty("--bgimg","url("+B.list[k]+")");pop.querySelectorAll(".bgopt").forEach((x,j)=>x.setAttribute("aria-pressed",j===k));try{localStorage.setItem(B.key,k)}catch(e){}};
 const open=o=>{pop.hidden=!o;btn.setAttribute("aria-expanded",o)};
 btn.onclick=e=>{e.stopPropagation();open(pop.hidden)};
 pop.onclick=e=>{e.stopPropagation();const b=e.target.closest(".bgopt");if(b)set(+b.dataset.k)};
 document.addEventListener("click",()=>open(false));
 document.addEventListener("keydown",e=>{if(e.key==="Escape")open(false)});
})();
</script>
</body>
</html>
