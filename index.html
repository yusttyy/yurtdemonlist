<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>YurtLink GDPS — Demonlist</title>
<style>
:root{color-scheme:dark;--bg:#0e0f1a;--card:#171a2b;--card2:#1e2238;--line:#2a2f4d;--tx:#e8eaf6;--mut:#8e94b8;--acc:#ff4d6d;--acc2:#7c5cff;--ok:#3ddc97;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:radial-gradient(1000px 500px at 80% -10%,#2a1a4a55,transparent),linear-gradient(#0e0f1a55,#0e0f1a99),url(bg.jpg) center/cover no-repeat fixed,var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh}
.hero{text-align:center;padding:44px 16px 6px}
.logo{font-weight:900;font-size:clamp(42px,10vw,88px);letter-spacing:1px;line-height:1.05;margin:0;text-shadow:0 4px 30px #000a}
.logo b{color:#3d8bff;background:linear-gradient(135deg,#5cc8ff,#3d6bff);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;text-shadow:none;filter:drop-shadow(0 4px 20px #0008)}
nav{display:inline-flex;gap:6px;flex-wrap:wrap;justify-content:center;margin-top:20px;padding:5px;background:#0e0f1acc;border:1px solid var(--line);border-radius:14px;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
nav button{background:none;border:1px solid transparent;color:var(--mut);padding:8px 14px;border-radius:10px;font:600 14px inherit;font-family:inherit;cursor:pointer}
nav button:hover{color:var(--tx)}nav button.on{color:#fff;background:linear-gradient(135deg,var(--acc),var(--acc2))}
main{max-width:1280px;width:calc(100% - 24px);margin:20px auto 12px;padding:22px 20px 28px;background:#0e0f1acc;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid var(--line);border-radius:20px;box-shadow:0 20px 60px #0009}
h1{margin:0 0 4px;font-size:26px}.sub{color:var(--mut);margin:0 0 16px;font-size:14px}
.tools{display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap}
input[type=search]{flex:1;min-width:200px;background:var(--card);border:1px solid var(--line);color:var(--tx);padding:10px 14px;border-radius:10px;font-size:14px}
.lvl{background:var(--card);border:1px solid var(--line);border-radius:14px;margin-bottom:12px;overflow:hidden;transition:border-color .15s}
.lvl:hover,.lvl.open{border-color:var(--acc2)}
.head{display:flex;gap:14px;cursor:pointer;align-items:stretch}
.chev{align-self:center;margin-right:18px;color:var(--mut);font-size:18px;transition:transform .25s}
.lvl.open .chev{transform:rotate(180deg)}
.det{display:grid;grid-template-rows:0fr;transition:grid-template-rows .3s ease}
.lvl.open .det{grid-template-rows:1fr}
.det-in{overflow:hidden;min-height:0}
.dbody{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:18px;padding:16px;border-top:1px solid var(--line)}
.vid{position:relative;aspect-ratio:16/9;background:#000;border-radius:12px;overflow:hidden}
.vid iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.novid{position:absolute;inset:0;display:grid;place-items:center;color:var(--mut);font-size:14px}
.thumb{position:relative;width:260px;flex:none;aspect-ratio:16/9;background:linear-gradient(135deg,#2b2f55,#4a1d3d);display:grid;place-items:center}
.thumb img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.thumb .pl{font-size:30px;opacity:.6}
.rank{position:absolute;left:8px;top:8px;background:#000a;padding:2px 10px;border-radius:8px;font-weight:800;font-size:15px}
.info{padding:12px 14px 12px 0;flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.info h3{margin:0;font-size:19px}
.meta{color:var(--mut);font-size:13.5px}.meta b{color:var(--tx);font-weight:600}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:auto;padding-top:6px}
.tag{font-size:12px;padding:3px 9px;border-radius:99px;background:var(--card2);border:1px solid var(--line);color:var(--mut)}
.tag.p{color:#fff;background:linear-gradient(135deg,var(--acc),var(--acc2));border:0;font-weight:700}
.tag.ok{color:var(--ok)}
.tag.d{color:#ff8fa3;background:#ff4d6d1a;border-color:#ff4d6d66}
.tag.c{color:#b3a2ff;background:#7c5cff1a;border-color:#7c5cff66}
.tbl{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.tbl th,.tbl td{padding:12px 14px;text-align:left;border-bottom:1px solid var(--line);font-size:14px}
.tbl th{color:var(--mut);font-size:12px;text-transform:uppercase;letter-spacing:.6px}
.tbl tr.row{cursor:pointer}.tbl tr.row:hover{background:var(--card2)}
.wrap{overflow-x:auto}
.podium{display:flex;align-items:flex-end;justify-content:center;gap:10px;margin:8px 0 22px}
.pod{flex:1;max-width:220px;display:flex;flex-direction:column;align-items:center;text-align:center;cursor:pointer;transition:.15s}
.pod:hover{transform:translateY(-3px)}
.pod.p1{--c:#ffd24d}.pod.p2{--c:#c8d0e0}.pod.p3{--c:#e0955a}
.pod .cr{font-size:22px;line-height:1;margin-bottom:2px}
.pod .av{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:22px;background:var(--card2);border:2px solid var(--c);margin-bottom:6px}
.pod .pn{font-weight:700;font-size:15px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pod .pp{color:var(--mut);font-size:13px;margin-bottom:8px}
.pod .step{width:100%;display:grid;place-items:center;background:linear-gradient(180deg,var(--card2),var(--card));border:1px solid var(--line);border-top:3px solid var(--c);border-radius:12px 12px 0 0}
.pod .step span{font-size:34px;font-weight:800;color:var(--c)}
.p1 .step{height:130px}.p2 .step{height:100px}.p3 .step{height:78px}
.top1{color:#ffd24d}.top2{color:#c8d0e0}.top3{color:#e0955a}
.modal{position:fixed;inset:0;background:#000b;display:none;place-items:center;z-index:20;padding:16px}
.modal.show{display:grid}
.box{background:var(--card);border:1px solid var(--line);border-radius:16px;max-width:620px;width:100%;max-height:90vh;overflow:auto}
.box .thumb{width:100%}.box .body{padding:16px 18px 18px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin:12px 0}
.grid div{background:var(--card2);padding:10px 12px;border-radius:10px;font-size:13px;color:var(--mut)}.grid b{display:block;color:var(--tx);font-size:15px;margin-top:2px}
.btn{display:inline-block;background:linear-gradient(135deg,var(--acc),var(--acc2));color:#fff;text-decoration:none;padding:10px 16px;border-radius:10px;font-weight:700;font-size:14px;border:0;cursor:pointer;font-family:inherit}
.btn.g{background:var(--card2);border:1px solid var(--line)}
.empty{color:var(--mut);text-align:center;padding:40px}
footer{text-align:center;color:var(--mut);font-size:12.5px;padding:12px 20px 24px;text-shadow:0 1px 6px #000}
@media(max-width:640px){main{padding:16px 12px 20px}.podium{gap:6px}.pod .av{width:44px;height:44px;font-size:18px}.pod .pn{font-size:13px}.head{flex-direction:column;gap:0}.dbody{grid-template-columns:1fr}.chev{display:none}.thumb{width:100%}.info{padding:12px 14px}}
</style>
</head>
<body>
<div class="hero">
<div class="logo">YurtLink <b>GDPS</b></div>
<nav id="nav">
<button data-t="demon" class="on">Демон лист</button>
<button data-t="challenge">Челлендж лист</button>
<button data-t="players">Игроки</button>
</nav></div>
<main><h1 id="ttl"></h1><p class="sub" id="sub"></p>
<div class="tools"><input type="search" id="q" placeholder="Поиск по названию, нику или ID…"></div>
<div id="out"></div></main>
<div class="modal" id="md"><div class="box" id="box"></div></div>
<footer>YurtLink GDPS · Demonlist · не связано с RobTop Games</footer>
<script>
/* ===== ДАННЫЕ — редактируй только тут =====
 Одна строка = один уровень. Порядок строк = место в списке (первая строка — топ 1).
 Формат:  Название | ID уровня | Сложность (можно оставить пустой) | Создатель | Верифер | ссылка или ID ютуб видео | прошли (через запятую)
 Строки, начинающиеся с #, игнорируются. */
const DEMONS=`
I dont like this | 9 | Medium Demon | s1lent | s1lent | 0LkCaXiTRJk | yusttyy
Goodbye | 8 | Easy Demon | yusttyy | yusttyy | MN-1RR10JX8 | 
`;
const CHALLENGES=`
SINERACK | 4 | Insane | yusttyy | yusttyy | oXLW1KTzgbs | 
DINAMIKA | 2 | Hard | bibis | bibis | sl1KzlnIRWA | yusttyy, s1lent, TEST-USER
`;
/* ===== ОЧКИ (одинаково для демон и челлендж листа) =====
 FIRST — очки за 1 место, DROP — во сколько раз меньше каждое следующее место
 (0.8 → 100, 80, 64, 51.2 …), VERIFY_BONUS — множитель для верифера уровня. */
const FIRST=100, DROP=0.8, VERIFY_BONUS=1.2;
const pts=r=>+(FIRST*Math.pow(DROP,r-1)).toFixed(2);
/* ===== логика ===== */
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const ytId=v=>{const m=String(v||"").match(/(?:v=|youtu\.be\/|embed\/)?([\w-]{11})/);return m?m[1]:""};
const ytUrl=v=>"https://www.youtube.com/watch?v="+ytId(v);
let tab="demon";
const META={demon:["Демон лист","Топ сложнейших уровней YurtLink GDPS. Чем выше уровень, тем больше очков."],
challenge:["Челлендж лист","Уровни-челленджи сервера: короткие, но очень требовательные."],
players:["Лист игроков","Рейтинг по сумме очков за верификации и прохождения."]};
const THQ=["maxresdefault","sddefault","hqdefault"];
function thumbFb(im){const n=+im.dataset.n+1;if(n<THQ.length){im.dataset.n=n;im.src="https://img.youtube.com/vi/"+im.dataset.v+"/"+THQ[n]+".jpg"}else im.remove()}
/* ===== ЦВЕТА СЛОЖНОСТЕЙ =====
 Если в названии есть слово "demon" — берётся палитра демонов; иначе палитра зависит от листа
 (демон лист → демоны, челлендж лист → обычные). Порядок важен: harder проверяется раньше hard. */
const DIFF_REG=[["insane","#ff4de4"],["harder","#ff4500"],["hard","#ffcc00"],["normal","#01ef00"],["easy","#00aeff"]];
const DIFF_DEM=[["extreme","#b80000"],["insane","#f31f12"],["hard","#ff3950"],["medium","#d838cd"],["easy","#9447f9"]];
const dc=d=>{d=(d||"").toLowerCase();const dem=d.includes("demon")||tab==="demon";const f=(dem?DIFF_DEM:DIFF_REG).find(x=>d.includes(x[0]));return f?f[1]:"var(--tx)"};
function thumb(l,rank){
 const i=ytId(l.yt);
 return `<div class="thumb"><span class="pl">▶</span>${i?`<img loading="lazy" alt="" data-v="${i}" data-n="0" src="https://img.youtube.com/vi/${i}/maxresdefault.jpg" onload="if(this.naturalWidth<200)thumbFb(this)" onerror="thumbFb(this)">`:""}${rank?`<span class="rank">#${rank}</span>`:""}</div>`;
}
const parse=t=>t.trim().split("\n").filter(s=>s.trim()&&!s.trim().startsWith("#")).map(s=>{
 const [name,id,diff,creator,verifier,yt,v]=s.split("|").map(x=>x.trim());
 return {name,id,diff,creator,verifier,yt,victors:(v||"").split(",").map(x=>x.trim()).filter(Boolean)};
});
function build(){
 const mk=(t,f)=>parse(t).map((l,i)=>({...l,rank:i+1,pts:f(i+1)}));
 return {demon:mk(DEMONS,pts),challenge:mk(CHALLENGES,pts)};
}
const L=build();
function players(){
 const m={};
 const add=(n,pts,lvl,v,t)=>{const p=m[n]||(m[n]={n,pts:0,list:[],ver:0,dem:[],chal:[]});p.pts+=pts;p.list.push(lvl);(t==="d"?p.dem:p.chal).push({name:lvl,v});if(v)p.ver++};
 [["d",L.demon],["c",L.challenge]].forEach(([t,arr])=>arr.forEach(l=>{
  add(l.verifier,+(l.pts*VERIFY_BONUS).toFixed(2),l.name,true,t);
  l.victors.forEach(n=>{if(n!==l.verifier)add(n,l.pts,l.name,false,t)});
 }));
 return Object.values(m).sort((a,b)=>b.pts-a.pts);
}
function render(){
 const q=$("#q").value.trim().toLowerCase();
 $("#ttl").textContent=META[tab][0];$("#sub").textContent=META[tab][1];
 const o=$("#out");
 if(tab==="players"){
  const all=players().map((p,i)=>({...p,rank:i+1}));
  const P=all.filter(p=>p.n.toLowerCase().includes(q));
  if(!P.length){o.innerHTML='<div class="empty">Ничего не найдено</div>';return}
  const pod=q?[]:all.slice(0,3), rest=q?P:all.slice(3);
  const podHtml=pod.length?`<div class="podium">${[1,0,2].filter(i=>pod[i]).map(i=>{const p=pod[i];return `<div class="pod p${i+1}" data-p="${esc(p.n)}">${i?"":'<div class="cr">👑</div>'}<div class="av">${esc(p.n.charAt(0).toUpperCase())}</div><div class="pn">${esc(p.n)}</div><div class="pp">${p.pts.toFixed(2)} очков</div><div class="step"><span>${i+1}</span></div></div>`}).join("")}</div>`:"";
  const tbl=rest.length?`<div class="wrap"><table class="tbl"><tr><th>#</th><th>Игрок</th><th>Уровней</th><th>Верификаций</th><th>Очки</th></tr>${rest.map(p=>`<tr class="row" data-p="${esc(p.n)}"><td class="${p.rank<4?"top"+p.rank:""}"><b>${p.rank}</b></td><td><b>${esc(p.n)}</b></td><td>${p.list.length}</td><td>${p.ver}</td><td><b>${p.pts.toFixed(2)}</b></td></tr>`).join("")}</table></div>`:"";
  o.innerHTML=podHtml+tbl;
  return;
 }
 const arr=L[tab].filter(l=>!q||[l.name,l.creator,l.verifier,l.id].join(" ").toLowerCase().includes(q));
 if(!arr.length){o.innerHTML='<div class="empty">Ничего не найдено</div>';return}
 o.innerHTML=arr.map(l=>`<div class="lvl" data-r="${l.rank}"><div class="head">${thumb(l,l.rank)}<div class="info"><h3>${esc(l.name)}</h3>
 <div class="meta">Создатель: <b>${esc(l.creator)}</b> · Верифер: <b>${esc(l.verifier)}</b></div>
 <div class="meta">ID: <b>${l.id}</b>${l.diff?` · <b style="color:${dc(l.diff)}">${esc(l.diff)}</b>`:""}</div>
 <div class="tags"><span class="tag p">${l.pts} очков</span><span class="tag ok">${new Set([l.verifier,...l.victors]).size} прошли</span></div></div><span class="chev">▾</span></div><div class="det"></div></div>`).join("");
}
const levelDetail=l=>{
 const i=ytId(l.yt), ok=i&&!/^x+$/i.test(i);
 const web=/^https?:/.test(location.protocol);
 const vid=ok&&web?`<iframe src="https://www.youtube.com/embed/${i}?rel=0&origin=${encodeURIComponent(location.origin)}" title="${esc(l.name)}" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>`:`<div class="novid" style="padding:16px;text-align:center">${ok?"Встроенный плеер YouTube не работает, когда сайт открыт как файл с диска (ошибка 153). Запусти сайт через хостинг или локальный сервер. Пока смотри по кнопке ниже.":"Видео ещё не добавлено"}</div>`;
 const ppl=[l.verifier,...l.victors.filter(n=>n!==l.verifier)];
 return `<div class="det-in"><div class="dbody"><div class="vid">${vid}</div><div class="side">
 <div class="grid"><div>Создатель<b>${esc(l.creator)}</b></div><div>Верифер<b>${esc(l.verifier)}</b></div><div>ID уровня<b>${l.id}</b></div><div>Очки<b>${l.pts}</b></div>${l.diff?`<div style="grid-column:1/-1">Сложность<b style="color:${dc(l.diff)}">${esc(l.diff)}</b></div>`:""}</div>
 <h4 style="margin:12px 0 6px">Прохождения · ${ppl.length}</h4>
 <div class="tags" style="padding:0">${ppl.map((n,k)=>`<span class="tag ok">${esc(n)}${k?"":" ✓"}</span>`).join("")}</div>
 ${ok?`<p style="margin:14px 0 0"><a class="btn g" target="_blank" rel="noopener" href="${ytUrl(l.yt)}">Открыть на YouTube</a></p>`:""}
 </div></div></div>`;
};
function toggleLvl(c){
 const was=c.classList.contains("open");
 document.querySelectorAll(".lvl.open").forEach(x=>{x.classList.remove("open");setTimeout(()=>{if(!x.classList.contains("open"))x.querySelector(".det").innerHTML=""},320)});
 if(was)return;
 c.querySelector(".det").innerHTML=levelDetail(L[tab].find(l=>l.rank==c.dataset.r));
 requestAnimationFrame(()=>c.classList.add("open"));
 setTimeout(()=>c.scrollIntoView({behavior:"smooth",block:"nearest"}),340);
}
const sec=(title,arr,c)=>`<h4 style="margin:14px 0 6px">${title} · ${arr.length}</h4><div class="tags" style="padding:0">${arr.length?arr.map(x=>`<span class="tag ${c}">${esc(x.name)}${x.v?" ✓":""}</span>`).join(""):'<span class="meta">—</span>'}</div>`;
function openPlayer(n){
 const p=players().find(x=>x.n===n);
 $("#box").innerHTML=`<div class="body"><h2 style="margin:0 0 4px">${esc(p.n)}</h2><div class="meta">${p.pts.toFixed(2)} очков · ${p.ver} верификаций</div>
 ${sec("Демоны",p.dem,"d")}${sec("Челленджи",p.chal,"c")}<div class="meta" style="margin-top:10px">✓ — верифер уровня</div>
 <p style="margin:16px 0 0"><button class="btn g" id="cl">Закрыть</button></p></div>`;
 $("#md").classList.add("show");$("#cl").onclick=close;
}
const close=()=>$("#md").classList.remove("show");
$("#md").onclick=e=>{if(e.target.id==="md")close()};
document.addEventListener("keydown",e=>{if(e.key==="Escape")close()});
$("#nav").onclick=e=>{const b=e.target.closest("button");if(!b)return;tab=b.dataset.t;
 document.querySelectorAll("nav button").forEach(x=>x.classList.toggle("on",x===b));$("#q").value="";render()};
$("#q").oninput=render;
$("#out").onclick=e=>{
 const h=e.target.closest(".head");if(h){toggleLvl(h.parentElement);return}
 const r=e.target.closest(".row,.pod");if(r)openPlayer(r.dataset.p);
};
render();
</script>
</body>
</html>
